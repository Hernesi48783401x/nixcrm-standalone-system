<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - NIXCRM License Manager</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div id="app"></div>
    
    <script>
        const API_BASE = '/api';
        let currentUser = null;
        
        // Check auth on load
        async function checkAuth() {
            try {
                const res = await fetch(`${API_BASE}/auth/me`, { credentials: 'include' });
                if (res.ok) {
                    currentUser = await res.json();
                    if (currentUser.role !== 'admin') {
                        alert('Acceso denegado: solo administradores');
                        showLogin();
                        return;
                    }
                    showDashboard();
                } else {
                    showLogin();
                }
            } catch (error) {
                showLogin();
            }
        }
        
        function showLogin() {
            document.getElementById('app').innerHTML = `
                <div class="container">
                    <div class="login-box">
                        <div class="login-header">
                            <div class="icon">🛡️</div>
                            <h1>Panel de Administrador</h1>
                            <p>Ingresa tus credenciales</p>
                        </div>
                        <form id="loginForm">
                            <div class="form-group">
                                <label>Usuario</label>
                                <input type="text" id="username" required>
                            </div>
                            <div class="form-group">
                                <label>Contraseña</label>
                                <input type="password" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                        </form>
                        <a href="/" class="back-link">← Volver al inicio</a>
                    </div>
                </div>
            `;
            
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
        }
        
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch(`${API_BASE}/auth/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });
                
                if (res.ok) {
                    const data = await res.json();
                    currentUser = data.user;
                    showDashboard();
                } else {
                    const error = await res.json();
                    alert(error.error || 'Error de autenticación');
                }
            } catch (error) {
                alert('Error de conexión');
            }
        }
        
        async function showDashboard() {
            // Load stats and resellers
            const [stats, resellers, licenses] = await Promise.all([
                fetch(`${API_BASE}/admin/stats`, { credentials: 'include' }).then(r => r.json()),
                fetch(`${API_BASE}/admin/resellers`, { credentials: 'include' }).then(r => r.json()),
                fetch(`${API_BASE}/admin/licenses`, { credentials: 'include' }).then(r => r.json())
            ]);
            
            document.getElementById('app').innerHTML = `
                <div class="dashboard">
                    <header class="dashboard-header">
                        <div>
                            <h1>🛡️ Panel de Administrador</h1>
                            <p>Bienvenido, ${currentUser.displayName}</p>
                        </div>
                        <div>
                            <a href="/" class="btn btn-secondary">Inicio</a>
                            <button onclick="logout()" class="btn btn-secondary">Cerrar Sesión</button>
                        </div>
                    </header>
                    
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value">${stats.totalResellers}</div>
                            <div class="stat-label">Total Revendedores</div>
                            <div class="stat-sub">${stats.activeResellers} activos</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.totalLicenses}</div>
                            <div class="stat-label">Licencias Generadas</div>
                            <div class="stat-sub">${stats.licensesLast24h} últimas 24h</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.totalQuotaAssigned}</div>
                            <div class="stat-label">Cuota Total Asignada</div>
                            <div class="stat-sub">${stats.totalQuotaUsed} usadas</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${stats.quotaRemaining}</div>
                            <div class="stat-label">Cuota Disponible</div>
                        </div>
                    </div>
                    
                    <div class="tabs">
                        <button class="tab-btn active" onclick="showTab('resellers')">Revendedores</button>
                        <button class="tab-btn" onclick="showTab('licenses')">Auditoría de Licencias</button>
                    </div>
                    
                    <div id="tab-resellers" class="tab-content active">
                        <div class="section-header">
                            <h2>Gestión de Revendedores</h2>
                            <button onclick="showCreateResellerModal()" class="btn btn-primary">+ Crear Revendedor</button>
                        </div>
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Usuario</th>
                                        <th>Nombre</th>
                                        <th>Email</th>
                                        <th>Cuota</th>
                                        <th>Días</th>
                                        <th>Estado</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${resellers.map(r => `
                                        <tr>
                                            <td><code>${r.username}</code></td>
                                            <td>${r.display_name}</td>
                                            <td>${r.email || '-'}</td>
                                            <td>${r.used_quota}/${r.total_quota}</td>
                                            <td>${r.days_mode === 'fixed' ? `${r.days_fixed} fijos` : `${r.days_min}-${r.days_max}`}</td>
                                            <td><span class="badge ${r.is_active ? 'badge-success' : 'badge-danger'}">${r.is_active ? 'Activo' : 'Inactivo'}</span></td>
                                            <td>
                                                <button onclick="editReseller(${r.id})" class="btn-icon">✏️</button>
                                                <button onclick="deleteReseller(${r.id}, '${r.display_name}')" class="btn-icon">🗑️</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <div id="tab-licenses" class="tab-content">
                        <h2>Auditoría de Licencias</h2>
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>License ID</th>
                                        <th>Cliente</th>
                                        <th>Hardware ID</th>
                                        <th>Días</th>
                                        <th>Expira</th>
                                        <th>Generada</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${licenses.map(l => `
                                        <tr>
                                            <td><code>${l.license_id.substring(0, 16)}...</code></td>
                                            <td>${l.student_name}</td>
                                            <td><code>${l.hardware_id.substring(0, 12)}...</code></td>
                                            <td>${l.days_validity}</td>
                                            <td>${new Date(l.expires_at * 1000).toLocaleDateString()}</td>
                                            <td>${new Date(l.created_at * 1000).toLocaleDateString()}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
                <div id="modal" class="modal"></div>
            `;
        }
        
        function showTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }
        
        function showCreateResellerModal() {
            document.getElementById('modal').innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Crear Nuevo Revendedor</h2>
                        <button onclick="closeModal()" class="close-btn">×</button>
                    </div>
                    <form id="createResellerForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Usuario *</label>
                                <input type="text" name="username" required>
                            </div>
                            <div class="form-group">
                                <label>Contraseña *</label>
                                <input type="password" name="password" required minlength="6">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Nombre para Mostrar *</label>
                            <input type="text" name="displayName" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="email">
                        </div>
                        <div class="form-group">
                            <label>Cuota de Licencias *</label>
                            <input type="number" name="totalQuota" value="10" min="0" required>
                        </div>
                        <div class="form-group">
                            <label>Modo de Días *</label>
                            <select name="daysMode" onchange="toggleDaysMode(this.value)">
                                <option value="fixed">Días Fijos</option>
                                <option value="range">Rango de Días</option>
                            </select>
                        </div>
                        <div id="daysFixed" class="form-group">
                            <label>Días Fijos *</label>
                            <input type="number" name="daysFixed" value="30" min="1">
                        </div>
                        <div id="daysRange" class="form-row" style="display: none;">
                            <div class="form-group">
                                <label>Días Mínimos *</label>
                                <input type="number" name="daysMin" value="7" min="1">
                            </div>
                            <div class="form-group">
                                <label>Días Máximos *</label>
                                <input type="number" name="daysMax" value="365" min="1">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Crear Revendedor</button>
                    </form>
                </div>
            `;
            
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('createResellerForm').addEventListener('submit', handleCreateReseller);
        }
        
        function toggleDaysMode(mode) {
            document.getElementById('daysFixed').style.display = mode === 'fixed' ? 'block' : 'none';
            document.getElementById('daysRange').style.display = mode === 'range' ? 'flex' : 'none';
        }
        
        async function handleCreateReseller(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            
            try {
                const res = await fetch(`${API_BASE}/admin/resellers`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });
                
                if (res.ok) {
                    alert('Revendedor creado exitosamente');
                    closeModal();
                    showDashboard();
                } else {
                    const error = await res.json();
                    alert(error.error || 'Error al crear revendedor');
                }
            } catch (error) {
                alert('Error de conexión');
            }
        }
        
        async function deleteReseller(id, name) {
            if (!confirm(`¿Estás seguro de eliminar al revendedor "${name}"?`)) return;
            
            try {
                const res = await fetch(`${API_BASE}/admin/resellers/${id}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                
                if (res.ok) {
                    alert('Revendedor eliminado');
                    showDashboard();
                } else {
                    alert('Error al eliminar');
                }
            } catch (error) {
                alert('Error de conexión');
            }
        }
        
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
        
        async function logout() {
            await fetch(`${API_BASE}/auth/logout`, { method: 'POST', credentials: 'include' });
            currentUser = null;
            showLogin();
        }
        
        // Initialize
        checkAuth();
    </script>
</body>
</html>
