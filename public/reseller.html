<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revendedor - NIXCRM License Manager</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div id="app"></div>
    
    <script>
        const API_BASE = '/api';
        let currentUser = null;
        
        async function checkAuth() {
            try {
                const res = await fetch(`${API_BASE}/auth/me`, { credentials: 'include' });
                if (res.ok) {
                    currentUser = await res.json();
                    if (currentUser.role !== 'reseller') {
                        alert('Acceso denegado: solo revendedores');
                        showLogin();
                        return;
                    }
                    showDashboard();
                } else {
                    showLogin();
                }
            } catch (error) {
                showLogin();
            }
        }
        
        function showLogin() {
            document.getElementById('app').innerHTML = `
                <div class="container">
                    <div class="login-box">
                        <div class="login-header">
                            <div class="icon">🔑</div>
                            <h1>Portal de Revendedor</h1>
                            <p>Ingresa tus credenciales</p>
                        </div>
                        <form id="loginForm">
                            <div class="form-group">
                                <label>Usuario</label>
                                <input type="text" id="username" required>
                            </div>
                            <div class="form-group">
                                <label>Contraseña</label>
                                <input type="password" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-success">Iniciar Sesión</button>
                        </form>
                        <a href="/" class="back-link">← Volver al inicio</a>
                    </div>
                </div>
            `;
            
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
        }
        
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch(`${API_BASE}/auth/reseller/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });
                
                if (res.ok) {
                    const data = await res.json();
                    currentUser = data.user;
                    showDashboard();
                } else {
                    const error = await res.json();
                    alert(error.error || 'Error de autenticación');
                }
            } catch (error) {
                alert('Error de conexión');
            }
        }
        
        async function showDashboard() {
            const [info, licenses] = await Promise.all([
                fetch(`${API_BASE}/reseller/info`, { credentials: 'include' }).then(r => r.json()),
                fetch(`${API_BASE}/reseller/licenses`, { credentials: 'include' }).then(r => r.json())
            ]);
            
            const quotaRemaining = info.totalQuota - info.usedQuota;
            const quotaPercentage = (info.usedQuota / info.totalQuota) * 100;
            
            document.getElementById('app').innerHTML = `
                <div class="dashboard">
                    <header class="dashboard-header">
                        <div>
                            <h1>🔑 Portal de Revendedor</h1>
                            <p>Bienvenido, ${info.displayName}</p>
                        </div>
                        <div>
                            <a href="/" class="btn btn-secondary">Inicio</a>
                            <button onclick="logout()" class="btn btn-secondary">Cerrar Sesión</button>
                        </div>
                    </header>
                    
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value">${info.totalQuota}</div>
                            <div class="stat-label">Cuota Total</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${info.usedQuota}</div>
                            <div class="stat-label">Licencias Usadas</div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${quotaPercentage}%"></div>
                            </div>
                        </div>
                        <div class="stat-card ${quotaRemaining === 0 ? 'stat-danger' : 'stat-success'}">
                            <div class="stat-value">${quotaRemaining}</div>
                            <div class="stat-label">Licencias Disponibles</div>
                        </div>
                    </div>
                    
                    ${quotaRemaining === 0 ? `
                        <div class="alert alert-danger">
                            ⚠️ Has alcanzado tu límite de licencias. Contacta al administrador para obtener más cuota.
                        </div>
                    ` : ''}
                    
                    <div class="alert alert-info">
                        ℹ️ ${info.daysMode === 'fixed' 
                            ? `Tus licencias tienen una duración fija de ${info.daysFixed} días`
                            : `Puedes generar licencias entre ${info.daysMin} y ${info.daysMax} días`
                        }
                    </div>
                    
                    <div class="tabs">
                        <button class="tab-btn active" onclick="showTab('generate')">Generar Licencia</button>
                        <button class="tab-btn" onclick="showTab('history')">Historial</button>
                    </div>
                    
                    <div id="tab-generate" class="tab-content active">
                        <div class="card">
                            <h2>Generar Nueva Licencia</h2>
                            <p class="text-muted">Completa los datos del cliente para generar una licencia NIXCRM v11.0</p>
                            
                            <form id="generateForm">
                                <div class="form-group">
                                    <label>Nombre del Cliente *</label>
                                    <input type="text" id="studentName" placeholder="Ej: Juan Pérez" required ${quotaRemaining === 0 ? 'disabled' : ''}>
                                </div>
                                
                                <div class="form-group">
                                    <label>Hardware ID del Cliente *</label>
                                    <input type="text" id="hardwareId" placeholder="64 caracteres hexadecimales" maxlength="64" required ${quotaRemaining === 0 ? 'disabled' : ''}>
                                    <small>El cliente debe obtener su Hardware ID ejecutando get_hardware_id_v11.py</small>
                                </div>
                                
                                <div class="form-group">
                                    <label>Días de Validez *</label>
                                    <input type="number" id="daysValidity" value="${info.daysMode === 'fixed' ? info.daysFixed : info.daysMin}" 
                                           min="${info.daysMode === 'range' ? info.daysMin : info.daysFixed}" 
                                           max="${info.daysMode === 'range' ? info.daysMax : info.daysFixed}"
                                           ${info.daysMode === 'fixed' || quotaRemaining === 0 ? 'disabled' : ''} required>
                                    ${info.daysMode === 'fixed' ? `<small>Valor fijo de ${info.daysFixed} días (no modificable)</small>` : ''}
                                </div>
                                
                                <button type="submit" class="btn btn-success btn-large" ${quotaRemaining === 0 ? 'disabled' : ''}>
                                    🔑 Generar Licencia (${quotaRemaining} restantes)
                                </button>
                            </form>
                            
                            <div class="info-box">
                                <h4>📝 Instrucciones:</h4>
                                <ol>
                                    <li>El cliente debe ejecutar <code>get_hardware_id_v11.py</code> en su PC</li>
                                    <li>El cliente te envía su Hardware ID (64 caracteres)</li>
                                    <li>Ingresas los datos aquí y generas la licencia</li>
                                    <li>El archivo .lic se descarga automáticamente</li>
                                    <li>Envías el archivo .lic al cliente</li>
                                    <li>El cliente SOLO puede usar la licencia en su PC</li>
                                </ol>
                            </div>
                        </div>
                    </div>
                    
                    <div id="tab-history" class="tab-content">
                        <h2>Historial de Licencias</h2>
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Cliente</th>
                                        <th>License ID</th>
                                        <th>Hardware ID</th>
                                        <th>Días</th>
                                        <th>Expira</th>
                                        <th>Generada</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${licenses.length > 0 ? licenses.map(l => `
                                        <tr>
                                            <td><strong>${l.student_name}</strong></td>
                                            <td><code>${l.license_id.substring(0, 16)}...</code></td>
                                            <td><code>${l.hardware_id.substring(0, 12)}...</code></td>
                                            <td>${l.days_validity}</td>
                                            <td>${new Date(l.expires_at * 1000).toLocaleDateString()}</td>
                                            <td>${new Date(l.created_at * 1000).toLocaleDateString()}</td>
                                        </tr>
                                    `).join('') : '<tr><td colspan="6" class="text-center">No has generado ninguna licencia aún</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
            
            if (quotaRemaining > 0) {
                document.getElementById('generateForm').addEventListener('submit', handleGenerate);
            }
        }
        
        function showTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }
        
        async function handleGenerate(e) {
            e.preventDefault();
            
            const studentName = document.getElementById('studentName').value.trim();
            const hardwareId = document.getElementById('hardwareId').value.trim().toUpperCase();
            const daysValidity = parseInt(document.getElementById('daysValidity').value);
            
            if (hardwareId.length !== 64 || !/^[0-9A-F]{64}$/i.test(hardwareId)) {
                alert('Hardware ID inválido. Debe tener exactamente 64 caracteres hexadecimales.');
                return;
            }
            
            try {
                const res = await fetch(`${API_BASE}/reseller/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ studentName, hardwareId, daysValidity })
                });
                
                if (res.ok) {
                    const data = await res.json();
                    
                    // Download license file
                    const blob = new Blob([data.fileContent], { type: 'application/json' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = data.filename;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                    
                    alert(`¡Licencia generada exitosamente!\\n\\nArchivo: ${data.filename}`);
                    showDashboard();
                } else {
                    const error = await res.json();
                    alert(error.error || 'Error al generar licencia');
                }
            } catch (error) {
                alert('Error de conexión');
            }
        }
        
        async function logout() {
            await fetch(`${API_BASE}/auth/logout`, { method: 'POST', credentials: 'include' });
            currentUser = null;
            showLogin();
        }
        
        checkAuth();
    </script>
</body>
</html>
