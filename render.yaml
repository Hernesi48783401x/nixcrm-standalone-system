services:
  - type: web
    name: nixcrm-standalone
    env: docker
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: ./data/nixcrm.db
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_ADMIN_USERNAME
        value: admin
      - key: DEFAULT_ADMIN_PASSWORD
        value: NixCRM2024!Secure
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@nixcrm.com
